<form action="" method="post" name="BhindAutoGenerate">
    <div>
        <label for="groupname">Group chat name: </label>
        <input type="text" id="groupname" required />
    </div>
    <hr />
    <div>
        <fieldset>
            <label for="chatter1">First chatter: </label>
            <input type="text" id="chatter1" required />
            <!-- <p>Should their messages be on the left or the right?</p>
            <label><input type="radio" name="POV" value="left" /> Left</label>
            <label><input type="radio" name="POV" value="right" /> Right</label> -->
            <label for="chatter2">Second chatter: </label>
            <input type="text" id="chatter2" required />
            <!-- <p>Should their messages be on the left or the right?</p>
            <label><input type="radio" name="POV" value="left" /> Left</label>
            <label><input type="radio" name="POV" value="right" /> Right</label> -->
            <label for="chatter3">Third chatter: </label>
            <input type="text" id="chatter3" required />
            <!-- <p>Should their messages be on the left or the right?</p>
            <label><input type="radio" name="POV" value="left" /> Left</label>
            <label><input type="radio" name="POV" value="right" /> Right</label> -->
        </fieldset>
    </div>
    <p>Add message from:</p>
    <div style="flex: row space-between">
        <label for="addchat1">First: </label>
        <label for="addchat2">Second: </label>
        <label for="addchat3">Third: </label>
    </div>
    <div style="flex: row space-between">
        <button id="addchat1">+</button>
        <button id="addchat2">+</button>
        <button id="addchat3">+</button>
    </div>
    <div>
        <input type="submit" value="Generate" />
    </div>
</form>
